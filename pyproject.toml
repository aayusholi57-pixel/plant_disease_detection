[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plant_disease_detection"
version = "1.0.0"
description = "Reproducible plant leaf disease classification API"
requires-python = ">=3.10,<3.12"
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.28,<1.0",
  "torch>=2.0,<3.0",
  "torchvision>=0.15,<1.0",
  "pillow>=10,<13",
  "pydantic>=2,<3",
  "python-multipart>=0.0.9,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "scripts*"]
