name: Deploy Plant Disease Detection

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Force rebuild without cache"
        required: false
        default: "false"
      skip_healthcheck:
        description: "Skip application health checks"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: plant-disease-api
  APP_DIR: ~/plant-disease-app
  IMAGE_TAG: ${{ github.sha }}

jobs:
  validate:
    name: Validate deployment config
    runs-on: ubuntu-latest
    outputs:
      valid: ${{ steps.validate.outputs.valid }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate required secrets
        shell: bash
        run: |
          set -Eeuo pipefail

          for secret_name in \
            AWS_REGION \
            AWS_ACCESS_KEY_ID \
            AWS_SECRET_ACCESS_KEY \
            EC2_HOST \
            EC2_USERNAME \
            EC2_SSH_KEY
          do
            if [ -z "${!secret_name:-}" ]; then
              echo "::error::Missing required secret: $secret_name"
              exit 1
            fi
          done

          echo "All required secrets are configured."

      - name: Validate Docker and compose files
        id: validate
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f Dockerfile || {
            echo "::error::Dockerfile not found"
            exit 1
          }

          test -f docker-compose.yml || {
            echo "::error::docker-compose.yml not found"
            exit 1
          }

          python3 - <<'PY'
          import sys
          import yaml
          try:
              with open("docker-compose.yml", "r", encoding="utf-8") as fh:
                  yaml.safe_load(fh)
              print("docker-compose.yml is valid YAML")
          except Exception as exc:
              print(f"::error::docker-compose.yml is invalid: {exc}")
              sys.exit(1)
          PY

          echo "valid=true" >> "$GITHUB_OUTPUT"

  build:
    name: Build and push Docker image
    needs: validate
    if: needs.validate.outputs.valid == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    outputs:
      registry: ${{ steps.ecr.outputs.registry }}
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        shell: bash
        run: |
          set -Eeuo pipefail

          if ! aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" >/dev/null 2>&1; then

            echo "ECR repository does not exist. Creating it..."
            aws ecr create-repository \
              --repository-name "$ECR_REPOSITORY" \
              --region "$AWS_REGION" \
              --image-scanning-configuration scanOnPush=true \
              --encryption-configuration encryptionType=AES

            aws ecr put-lifecycle-policy \
              --repository-name "$ECR_REPOSITORY" \
              --region "$AWS_REGION" \
              --lifecycle-policy-text '{
                "rules": [
                  {
                    "rulePriority": 1,
                    "description": "Keep newest 20 sha images",
                    "selection": {
                      "tagStatus": "tagged",
                      "tagPrefixList": ["sha-"],
                      "countType": "imageCountMoreThan",
                      "countNumber": 20
                    },
                    "action": { "type": "expire" }
                  },
                  {
                    "rulePriority": 2,
                    "description": "Remove untagged images after 7 days",
                    "selection": {
                      "tagStatus": "untagged",
                      "countType": "sinceImagePushed",
                      "countUnit": "days",
                      "countNumber": 7
                    },
                    "action": { "type": "expire" }
                  }
                ]
              }'
          else
            echo "ECR repository already exists."
          fi

      - name: Set image name
        id: image
        shell: bash
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -Eeuo pipefail

          IMAGE="$REGISTRY/$ECR_REPOSITORY:sha-$IMAGE_TAG"
          LATEST="$REGISTRY/$ECR_REPOSITORY:latest"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

          echo "SHA image: $IMAGE"
          echo "Latest image: $LATEST"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ steps.image.outputs.latest }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify pushed image
        shell: bash
        run: |
          set -Eeuo pipefail

          for i in $(seq 1 10); do
            if aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids imageTag="sha-$IMAGE_TAG" \
              --region "$AWS_REGION" >/dev/null 2>&1; then
              echo "Image verified in ECR"
              exit 0
            fi

            echo "Waiting for image to appear in ECR... attempt $i/10"
            sleep 10
          done

          echo "::error::Image verification failed in ECR"
          exit 1

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install SSH key
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts || true
          chmod 600 ~/.ssh/known_hosts

      - name: Test SSH connectivity
        shell: bash
        run: |
          set -Eeuo pipefail

          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}" \
            "echo 'SSH connection ok' && uname -a"

      - name: Upload docker-compose.yml
        shell: bash
        run: |
          set -Eeuo pipefail

          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}" \
            "mkdir -p '${{ env.APP_DIR }}' && chmod 755 '${{ env.APP_DIR }}'"

          scp \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            docker-compose.yml \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:${{ env.APP_DIR }}/docker-compose.yml"

      - name: Deploy to EC2 with rollback
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          ECR_REGISTRY: ${{ needs.build.outputs.registry }}
          ECR_IMAGE: ${{ needs.build.outputs.image }}
          AWS_REGION_REMOTE: ${{ env.AWS_REGION }}
          APP_DIR_REMOTE: ${{ env.APP_DIR }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          set -Eeuo pipefail

          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$EC2_USERNAME@$EC2_HOST" \
            "ECR_REGISTRY='$ECR_REGISTRY' \
             ECR_IMAGE='$ECR_IMAGE' \
             AWS_REGION='$AWS_REGION_REMOTE' \
             APP_DIR='$APP_DIR_REMOTE' \
             HEALTHCHECK_URL='$HEALTHCHECK_URL' \
             bash -s" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          trap 'echo "ERROR: Deployment failed at line $LINENO"; exit 1' ERR

          log() {
            echo "[$(date +'%Y-%m-%d %H:%M:%S')] $*"
          }

          COMPOSE="docker compose"
          BACKUP_DIR="$APP_DIR/.deploy-backups"
          LOGS_DIR="$APP_DIR/.deploy-logs"
          CURRENT_ENV="$APP_DIR/.env"
          PREVIOUS_ENV="$BACKUP_DIR/previous.env"
          NEW_ENV="$APP_DIR/.env.new"

          mkdir -p "$APP_DIR" "$BACKUP_DIR" "$LOGS_DIR"
          cd "$APP_DIR"

          log "Validating remote prerequisites..."
          command -v docker >/dev/null 2>&1 || {
            log "Docker is not installed"
            exit 1
          }

          docker compose version >/dev/null 2>&1 || {
            log "Docker Compose is not installed"
            exit 1
          }

          command -v aws >/dev/null 2>&1 || {
            log "AWS CLI is not installed"
            exit 1
          }

          command -v curl >/dev/null 2>&1 || {
            log "curl is not installed"
            exit 1
          }

          if [ -f "$CURRENT_ENV" ]; then
            cp "$CURRENT_ENV" "$PREVIOUS_ENV"
            log "Previous deployment backup created"
          else
            rm -f "$PREVIOUS_ENV"
            log "No previous deployment existed"
          fi

          log "Authenticating Docker to ECR..."
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

          log "Pulling image: $ECR_IMAGE"
          for i in $(seq 1 3); do
            if docker pull "$ECR_IMAGE"; then
              break
            fi
            if [ "$i" -eq 3 ]; then
              log "Failed to pull image after 3 attempts"
              exit 1
            fi
            sleep 10
          done

          grep -q '\${ECR_IMAGE}' docker-compose.yml || {
            log "docker-compose.yml must reference \${ECR_IMAGE}"
            exit 1
          }

          cat > "$NEW_ENV" <<EOF
          ECR_IMAGE=$ECR_IMAGE
          AWS_REGION=$AWS_REGION
          EOF

          chmod 600 "$NEW_ENV"

          log "Validating Docker Compose config"
          docker compose --env-file "$NEW_ENV" config >/dev/null || {
            log "Invalid docker-compose configuration"
            docker compose --env-file "$NEW_ENV" config
            exit 1
          }

          log "Stopping current app..."
          docker compose --env-file "$CURRENT_ENV" down --remove-orphans --timeout 30 || true

          mv "$NEW_ENV" "$CURRENT_ENV"

          log "Starting new app..."
          docker compose --env-file "$CURRENT_ENV" up \
            --detach \
            --remove-orphans \
            --wait \
            --wait-timeout 120 || {
              log "Container startup failed"
              docker compose --env-file "$CURRENT_ENV" logs --tail=300 || true
              exit 1
          }

          log "Checking container health..."
          if docker compose --env-file "$CURRENT_ENV" ps | grep -Eiq 'exited|dead|unhealthy'; then
            log "One or more containers are unhealthy"
            docker compose --env-file "$CURRENT_ENV" logs --tail=300 || true
            exit 1
          fi

          if [ -n "${HEALTHCHECK_URL:-}" ]; then
            log "Running health check against $HEALTHCHECK_URL"
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error --max-time 10 "$HEALTHCHECK_URL" >/dev/null 2>&1; then
                log "Health check passed"
                break
              fi

              if [ "$attempt" -eq 30 ]; then
                log "Health check failed after 30 attempts"
                docker compose --env-file "$CURRENT_ENV" logs --tail=300 || true
                exit 1
              fi

              sleep 5
            done
          fi

          log "Cleaning up old backups..."
          find "$BACKUP_DIR" -type f -mtime +14 -delete || true
          find "$LOGS_DIR" -type f -mtime +30 -delete || true

          docker image prune -af --filter "until=168h" || true
          docker container prune -af --filter "until=24h" || true

          log "Deployment successful: $ECR_IMAGE"
          REMOTE_SCRIPT

      - name: Verify deployed services
        shell: bash
        run: |
          set -Eeuo pipefail

          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}" \
            "cd '${{ env.APP_DIR }}' && docker compose --env-file .env ps"

      - name: Roll back on failure
        if: failure()
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Deployment failed; attempting rollback..."

          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}" \
            "APP_DIR='${{ env.APP_DIR }}' bash -s" <<'REMOTE_ROLLBACK'
          set -Eeuo pipefail

          cd "$APP_DIR" || exit 1

          CURRENT_ENV="$APP_DIR/.env"
          PREVIOUS_ENV="$APP_DIR/.deploy-backups/previous.env"

          if [ ! -s "$PREVIOUS_ENV" ]; then
            echo "No previous deployment backup exists; rollback unavailable."
            docker compose --env-file "$CURRENT_ENV" logs --tail=300 || true
            exit 1
          fi

          echo "Rolling back to previous environment..."

          docker compose --env-file "$CURRENT_ENV" down --remove-orphans --timeout 30 || true
          cp "$PREVIOUS_ENV" "$CURRENT_ENV"

          docker compose --env-file "$CURRENT_ENV" pull || true
          docker compose --env-file "$CURRENT_ENV" up \
            --detach \
            --remove-orphans \
            --wait \
            --wait-timeout 120 || {
              echo "Rollback failed"
              docker compose --env-file "$CURRENT_ENV" logs --tail=300 || true
              exit 1
          }

          if docker compose --env-file "$CURRENT_ENV" ps | grep -Eiq 'exited|dead|unhealthy'; then
            echo "Rollback left containers unhealthy"
            docker compose --env-file "$CURRENT_ENV" logs --tail=300 || true
            exit 1
          fi

          echo "Rollback completed successfully"
          docker compose --env-file "$CURRENT_ENV" ps
          REMOTE_ROLLBACK

      - name: Cleanup SSH key
        if: always()
        shell: bash
        run: |
          rm -f ~/.ssh/deploy_key
          rm -f ~/.ssh/known_hosts
          echo "SSH cleanup complete"

  notify:
    name: Deployment status
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Print final status
        shell: bash
        run: |
          echo "Build status: ${{ needs.build.result }}"
          echo "Deploy status: ${{ needs.deploy.result }}"
          echo "Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
